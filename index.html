    <!--
      Theme FOUC guard: runs before paint so light/dark is correct on first frame.
      ThemeProvider keeps localStorage key "zenvio-theme" in sync.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("zenvio-theme");
          var prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
          var useLight = stored === "light" || (!stored && prefersLight);
          if (useLight) document.documentElement.classList.add("light-theme");
        } catch (e) {
          /* localStorage / matchMedia unavailable — stay in dark default */
        }
      })();
    </script>
